name: MyPOS CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  pilot-gate:
    name: Pilot Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build POS Console
        run: npm run build --workspace @mypos/pos-console

      - name: Build KDS
        run: npm run build --workspace @mypos/kds

      - name: Build Customer QR
        run: npm run build --workspace @mypos/customer-qr

      - name: Smoke
        run: npm run smoke:all

      - name: Production Readiness Report
        run: npm run prod:check
        continue-on-error: true
